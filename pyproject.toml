[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Mage-Flow-Turbo-And-Mage-Flow-Edit-Turbo-On-T4x2-GPU"
dynamic = ["version"]
description = "Reproducible Kaggle NVIDIA T4 x2 workflow and REST API for Mage-Flow Turbo and Mage-Flow Edit Turbo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Đăng Khoa", email = "i.am@dangkhoa.dev" },
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "requests>=2.32,<3",
  "pillow>=12.3,<13",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.27,<1"]
quality = [
  "build>=1,<2",
  "mypy==2.3.1",
  "pip-audit>=2.7,<3",
  "ruff==0.16.7",
  "twine>=6.0.1,<7",
  "types-requests>=2.32",
]

[tool.setuptools]
packages = ["server", "server.safety", "server.workers"]

[tool.setuptools.dynamic]
version = {attr = "server._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["server", "scripts", "examples", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI Depends()/File()/Form() in defaults is intentional
  "SIM105", # contextlib.suppress readability handled case by case
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["server", "scripts"]

[[tool.mypy.overrides]]
# mage_flow and torch live only inside the GPU-qualified runtime environment;
# the coordinator and static gates must never import them. Typed wrappers treat
# them as Any while the CPU-safe validators still reject them at cell scope and
# the quality job runs mypy without a GPU venv (CPU-only mypy quality lane).
module = [
  "mage_flow",
  "mage_flow.models.modules._attn_backend",
  "mage_flow.models.modules.mage_text",
  "mage_flow.pipeline",
  "torch",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `server.workers.conditioning_offload` is GPU-runtime-only (torch-bound
# controller). Its `wrapped_forward` closure line is byte-locked by the frozen
# pinned-memory-offload patch (R14), so the missing return annotation cannot be
# added without breaking patch application; the controller is only ever invoked
# with a real torch model and is exercised by integration tests on the GPU box.
module = ["server.workers.conditioning_offload"]
disallow_incomplete_defs = false
