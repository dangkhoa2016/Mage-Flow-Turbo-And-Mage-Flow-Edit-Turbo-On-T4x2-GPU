[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-flow-t4x2-production-rest-api-demo"
dynamic = ["version"]
description = "Production-style Kaggle NVIDIA T4 x2 REST API demo for Mage-Flow Turbo and Mage-Flow Edit Turbo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Đăng Khoa", email = "i.am@dangkhoa.dev" },
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "requests>=2.32,<3",
  "pillow>=12.3,<13",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.27,<1"]
quality = [
  "build>=1,<2",
  "mypy==2.3.1",
  "pip-audit>=2.7,<3",
  "ruff==0.16.7",
  "twine>=5,<6",
  "types-requests>=2.32",
]

[tool.setuptools]
packages = ["server", "server.safety", "server.workers"]

[tool.setuptools.dynamic]
version = {attr = "server._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["server", "scripts", "examples", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI Depends()/File()/Form() in defaults is intentional
  "SIM105", # contextlib.suppress readability handled case by case
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["server", "scripts"]

[[tool.mypy.overrides]]
# mage_flow lives only inside the GPU-qualified runtime environment; the
# coordinator and static gates must never import it. Typed wrappers treat it as
# Any while the CPU-safe validators still reject it at cell scope (P1-16).
module = ["mage_flow", "mage_flow.models.modules._attn_backend"]
ignore_missing_imports = true
